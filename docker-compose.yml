services:
  postgres:
    image: postgres:16-alpine
    container_name: vegan-university-postgres
    environment:
      POSTGRES_USER: vegan
      POSTGRES_PASSWORD: vegan
      POSTGRES_DB: vegan_university
    ports:
      - "5433:5432"
    volumes:
      - vegan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vegan -d vegan_university"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vegan_pgdata:
